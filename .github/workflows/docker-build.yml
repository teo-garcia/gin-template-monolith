name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify production image
    uses: teo-garcia/templates/.github/workflows/reusable-container-verification.yml@02a8caa55d7b43f53f8811bb2d644dd90e73a940 # delivery-v0.1.0
    with:
      target: production
