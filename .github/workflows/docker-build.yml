name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: production
          push: false
          load: true
          tags: gin-template-monolith:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image entrypoint
        run: docker run --rm gin-template-monolith:ci /app/migrate version || true
