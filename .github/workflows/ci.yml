name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.11.0

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gin_monolith_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Generate lint config
        run: make lint-sync

      - name: Check
        run: make check

      - name: Build
        run: make build

      - name: Migrate test database
        run: go run ./cmd/migrate up
        env:
          APP_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/gin_monolith_test?sslmode=disable

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Start conformance server
        env:
          APP_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/gin_monolith_test?sslmode=disable
          DOCS_ENABLED: "true"
          LOG_JSON: "true"
          METRICS_ENABLED: "true"
          OTEL_ENABLED: "false"
          PORT: "43118"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          THROTTLE_LIMIT: "1000"
        run: |
          ./bin/api > "$RUNNER_TEMP/backend-conformance.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/backend-conformance.pid"

      - name: Shared backend conformance
        uses: teo-garcia/templates/conformance/backend@da8df26c4c9a9f0299d227be6164898301e1888f
        with:
          base_url: http://127.0.0.1:43118

      - name: Upload conformance log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-conformance-log
          path: ${{ runner.temp }}/backend-conformance.log
          retention-days: 7

      - name: Stop conformance server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/backend-conformance.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/backend-conformance.pid")" 2>/dev/null || true
          fi
