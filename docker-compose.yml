services:
  db:
    image: postgres:18-alpine
    container_name: gin_monolith_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-gin_monolith}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gin-network

  redis:
    image: redis:alpine
    container_name: gin_monolith_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli --pass "$$REDIS_PASSWORD" ping; else redis-cli ping; fi']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - gin-network

  # Migrations run as their own service, before the app starts. They must never
  # run from application startup.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: "no"
    command: ["/app/migrate", "up"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@db:5432/${DATABASE_NAME:-gin_monolith}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gin-network

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: gin_monolith_app
    restart: unless-stopped
    environment:
      APP_ENV: development
      PORT: ${PORT:-3000}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      DATABASE_URL: postgres://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@db:5432/${DATABASE_NAME:-gin_monolith}?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_JSON: ${LOG_JSON:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      # Source is mounted for live reload; the module cache is a named volume so
      # it survives rebuilds and is never shadowed by the host.
      - .:/app
      - go_mod_cache:/go/pkg/mod
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-3000}/health/live | grep -q ok || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - gin-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: gin_monolith_pgadmin
    restart: unless-stopped
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - gin-network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  go_mod_cache:

networks:
  gin-network:
    driver: bridge
