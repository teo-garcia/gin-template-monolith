# Live reload for `docker compose up`. Not used by the production image.
root = "."
tmp_dir = ".air"

[build]
  cmd = "go build -o ./.air/api ./cmd/api"
  bin = "./.air/api"
  include_ext = ["go", "sql", "html"]
  exclude_dir = ["bin", "coverage", ".air", ".git", ".github", "docker"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  stop_on_error = true

[log]
  time = true
